# Kapitel 17 – Mosquitto-Konfiguration für das Leap-Gateway
# Datei: /etc/mosquitto/conf.d/leap.conf
#
# Mosquitto 2.x lauscht ohne Listener-Angabe nur auf localhost und verlangt
# Authentifizierung. Wir öffnen 1883 im LAN mit Benutzer/Passwort + ACL.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Optional: TLS auf 8883 (Zertifikate z. B. per Let's Encrypt oder eigener CA)
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key

persistence true
persistence_location /var/lib/mosquitto/
